retrain:
  name: Retrain ML Model
  description: Trigger an immediate retraining cycle.
  fields:
    force:
      name: Force Retrain
      description: Save the new model even if validation MAE did not improve, and train with as few as 2 samples.
      required: false
      default: false
      selector:
        boolean: {}

decision:
  name: Run Decision
  description: Trigger an immediate ML decision cycle (bypasses normal schedule).
  fields: {}
