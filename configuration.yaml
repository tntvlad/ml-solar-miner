# ===========================
# RESTful Sensors
# ===========================

rest:

        
  # Replace with your inverter's IP and port
  - resource: "http://YOUR_INVERTER_IP:5000/api/v1/inverter/data/status"
    scan_interval: 30
    timeout: 10
    sensor:
    # Solar PV
        - name: "Inverter PV1 Power"
          value_template: "{{ value_json.pv.pv1_power | int(0) }}"
          unit_of_measurement: "W"
          device_class: "power"
          state_class: "measurement"
          icon: "mdi:solar-panel"

