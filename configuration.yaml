template:
  - sensor:

  # Stats sensor with proper default value handling
      - name: "Instant RON per kWh MiningDutch"
        unit_of_measurement: "RON/kWh"
        state: >
          {% set profit_24h = states('sensor.grs_profitability') | float(0) %}
          {% set hashrate = 10.8 %}
          {% set btc_usd = states('sensor.btc_to_usd') | float(0) %}
          {% set usd_ron = states('sensor.usd_to_ron') | float(0) %}
          {% set power_watt = states('sensor.tasmota_energy_power') | float(0) %}
          {% set btc_earned_24h = profit_24h * hashrate %}
          {% set ron_earned_24h = btc_earned_24h * btc_usd * usd_ron %}
          {% set kwh_24h = (power_watt / 1000) * 24 %}
          {% if kwh_24h > 0 %}
            {{ (ron_earned_24h / kwh_24h) | round(2) }}
          {% else %}
            0
          {% endif %}
      - name: "Instant RON per kWh Zergpool"
        unit_of_measurement: "RON/kWh"
        state: >
          {% set profit_24h = states('sensor.zergpool_profitability') | float(0) %}
          {% set hashrate = 10.8 %}
          {% set btc_usd = states('sensor.btc_to_usd') | float(0) %}
          {% set usd_ron = states('sensor.usd_to_ron') | float(0) %}
          {% set power_watt = states('sensor.tasmota_energy_power') | float(0) %}
          {% set btc_earned_24h = profit_24h * hashrate %}
          {% set ron_earned_24h = btc_earned_24h * btc_usd * usd_ron %}
          {% set kwh_24h = (power_watt / 1000) * 24 %}
          {% if kwh_24h > 0 %}
            {{ (ron_earned_24h / kwh_24h) | round(2) }}
          {% else %}
            0
          {% endif %}
     
      - name: "Cooling Stats"
        state: >
          {% if is_state('binary_sensor.cooling_active', 'on') %}
            Active
          {% else %}
            Inactive
          {% endif %}
        attributes:
          max_temp: >
            {% if states('input_number.cooling_max_temp') not in ['unknown', 'unavailable', 'none', ''] %}
              {{ states('input_number.cooling_max_temp') }}
            {% else %}
              unknown
            {% endif %}
          min_temp: >
            {% if states('input_number.cooling_min_temp') not in ['unknown', 'unavailable', 'none', ''] %}
              {{ states('input_number.cooling_min_temp') }}
            {% else %}
              unknown
            {% endif %}
          duration: >
            {% if states('input_number.cooling_duration') not in ['unknown', 'unavailable', 'none', ''] %}
              {{ states('input_number.cooling_duration') }}
            {% else %}
              0
            {% endif %}
          
  # Binary sensor to track cooling state with debounce
  - binary_sensor:
      - name: "Grid Connected"
        state: "{{ is_state('sensor.victron_vebus_activein_activeinput_227', 'AC_INPUT_1') }}"
        icon: >-
          {% if is_state('sensor.victron_vebus_activein_activeinput_227', 'AC_INPUT_1') %}
            mdi:power-plug
          {% else %}
            mdi:power-plug-off
          {% endif %}

      - name: "Cooling Active"
        state: "{{ is_state('switch.cooling_oil', 'on') }}"
        delay_off:
          seconds: 5

  - sensor:
      - name: "Cooling Overshoot"
        unique_id: cooling_overshoot
        unit_of_measurement: "°C"
        state: >-
          {% set min_after_cooling = state_attr('sensor.temperature_stats', 'min_temp_after_cooling') | float(0) %}
          {% set target = states('input_number.oil_temp_target') | float %}
          {% if min_after_cooling > 0 %}
            {{ target - min_after_cooling }}
          {% else %}
            {{ 0 }}
          {% endif %}
          
      - name: "Cooling Undershoot"
        unique_id: cooling_undershoot
        unit_of_measurement: "°C"
        state: >-
          {% set max_before_cooling = state_attr('sensor.temperature_stats', 'max_temp_before_cooling') | float(0) %}
          {% set target = states('input_number.oil_temp_target') | float %}
          {% if max_before_cooling > 0 %}
            {{ max_before_cooling - target }}
          {% else %}
            {{ 0 }}
          {% endif %}
          
      - name: "Cooling Cycle Duration"
        unique_id: cooling_cycle_duration
        unit_of_measurement: "min"
        state: >-
          {% if is_state_attr('sensor.temperature_stats', 'last_cooling_duration', 'unknown') %}
            0
          {% else %}
            {{ state_attr('sensor.temperature_stats', 'last_cooling_duration') | float(0) / 60 }}
          {% endif %}
          
      - name: "Cooling Temperature Error"
        unique_id: cooling_temperature_error
        state: >
          {{ (states('sensor.tasmota_ds18b20_temperature') | float - 
             states('input_number.cooling_target_temp') | float) | round(2) }}
        unit_of_measurement: "°C"
  - sensor:
      - name: "Cooling Temperature Error"
        unique_id: cooling_temperature_error
        state: >
          {{ (states('sensor.tasmota_ds18b20_temperature') | float - 
             states('input_number.cooling_target_temp') | float) | round(2) }}
        unit_of_measurement: "°C"
      
      - name: "Cooling Duty Cycle"
        unique_id: cooling_duty_cycle
        state: "{{ state_attr('automation.immersion_cooling_pid_controller', 'pid_output') | default(0) | round(1) }}"
        unit_of_measurement: "%"
        
      - name: "Temperature Stability Score"
        unique_id: temperature_stability_score
        state: >
          {% set samples = state_attr('sensor.temperature_stability_score', 'samples') | default([]) %}
          {% set current_error = states('sensor.cooling_temperature_error') | float %}
          {% set new_samples = samples + [current_error] %}
          {% if new_samples | length > 60 %}
            {% set new_samples = new_samples[1:] %}
          {% endif %}
          {% set variance = 0 %}
          {% if new_samples | length > 10 %}
            {% set mean = new_samples | sum / new_samples | length %}
            {% for sample in new_samples %}
              {% set variance = variance + (sample - mean) ** 2 %}
            {% endfor %}
            {% set variance = variance / new_samples | length %}
            {% set stability = 100 - (variance * 10) | round %}
            {% set stability = [0, [100, stability]|min]|max %}
            {{ stability }}
          {% else %}
            50
          {% endif %}
        unit_of_measurement: "%"
        attributes:
          samples: >
            {% set samples = state_attr('sensor.temperature_stability_score', 'samples') | default([]) %}
            {% set current_error = states('sensor.cooling_temperature_error') | float %}
            {% set new_samples = samples + [current_error] %}
            {% if new_samples | length > 60 %}
              {% set new_samples = new_samples[1:] %}
            {% endif %}
            {{ new_samples }}
  - sensor:
      - name: "Predicted Temperature"
        state: >
          {% set current_temp = states('sensor.tasmota_ds18b20_temperature') | float %}
          {% set rise_rate = states('sensor.temperature_rise_rate') | float(0) %}
          {% set factor = states('input_number.anticipation_factor') | float %}
          {{ (current_temp + (rise_rate * factor)) | round(1) }}
        unit_of_measurement: "°C"    
  
      - name: "Chip-Oil Temperature Delta"
        state: >
          {% set chip_temp = (states('sensor.antminer_board_0_board_temperature')|float + 
                             states('sensor.antminer_board_1_board_temperature')|float + 
                             states('sensor.antminer_board_2_board_temperature')|float) / 3 %}
          {% set oil_temp = states('sensor.tasmota_ds18b20_temperature')|float %}
          {{ (chip_temp - oil_temp) | round(1) }}
        unit_of_measurement: "°C"    

      - name: "Cooling Efficiency"
        state: >
          {% set delta = states('sensor.chip_oil_temperature_delta')|float(0) %}
          {% if delta > 25 %}
            {{ "Excellent" }}
          {% elif delta > 20 %}
            {{ "Good" }}
          {% elif delta > 15 %}
            {{ "Average" }}
          {% else %}
            {{ "Poor" }}
          {% endif %}
        icon: >
          {% set delta = states('sensor.chip_oil_temperature_delta')|float(0) %}
          {% if delta > 25 %}
            {{ "mdi:thumb-up" }}
          {% elif delta > 20 %}
            {{ "mdi:check-circle" }}
          {% elif delta > 15 %}
            {{ "mdi:alert" }}
          {% else %}
            {{ "mdi:alert-circle" }}
          {% endif %}

      # ═══════════════════════════════════════════════════════════════════
      # MINING DECISION ENGINE SENSORS
      # ═══════════════════════════════════════════════════════════════════

      # ─── TOTAL SOLAR POWER (all 5 MPPT sources combined) ───────────────
      - name: "solar_power_total"
        unique_id: solar_power_total
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set i1 = states('sensor.infinisolar_v_multiphase_x_3_inverter_1_pv_power') | float(0) %}
          {% set i2 = states('sensor.infinisolar_v_multiphase_x_3_inverter_2_pv_power') | float(0) %}
          {% set i3 = states('sensor.infinisolar_v_multiphase_x_3_inverter_3_pv_power') | float(0) %}
          {% set v1 = states('sensor.victron_solarcharger_yield_power_226') | float(0) %}
          {% set v2 = states('sensor.victron_solarcharger_yield_power_224') | float(0) %}
          {{ (i1 + i2 + i3 + v1 + v2) | round(0) }}

      # ─── SOLAR SURPLUS (solar minus house load WITHOUT miners) ───────────
      - name: "solar_surplus_power"
        unique_id: solar_surplus_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set solar = states('sensor.solar_power_total') | float(0) %}
          {% set total_load = states('sensor.total_load_power') | float(0) | abs %}
          {% set miner_actual = states('sensor.antminer_miner_consumption_2') | float(0) %}
          {% set house_load = total_load - miner_actual %}
          {{ (solar - house_load) | round(0) }}

      # ─── TOTAL BATTERY CURRENT (Victron + Infinisolar combined) ─────────
      - name: "battery_current_total"
        unique_id: battery_current_total
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        state: >
          {% set a1 = states('sensor.victron_battery_current') | float(0) %}
          {% set a2 = states('sensor.infinisolar_v_multiphase_x_3_battery_1_current') | float(0) %}
          {% set a1_ok = states('sensor.victron_battery_current') not in ['unavailable', 'unknown'] %}
          {% set a2_ok = states('sensor.infinisolar_v_multiphase_x_3_battery_1_current') not in ['unavailable', 'unknown'] %}
          {{ ((a1 if a1_ok else 0) + (a2 if a2_ok else 0)) | round(1) }}

      # ─── BATTERY POWER (watts) ──────────────────────────────────────────
      - name: "battery_power_total"
        unique_id: battery_power_total
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
            {% set v = states('sensor.infinisolar_v_multiphase_x_3_battery_1_voltage') | float(0) %}
            {% set a1 = states('sensor.victron_battery_current') | float(0) * 2 %}
            {% set a2 = states('sensor.infinisolar_v_multiphase_x_3_battery_1_current') | float(0) %}
            {{ (v * (a1 + a2)) | round(0) }}

      # ─── PYLONTECH PACK CURRENT (diagnostic / balance check only) ───────
      - name: "pylontech_pack_current_total"
        unique_id: pylontech_pack_current_total
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        state: >
          {% set c1 = states('sensor.infinisolar_v_multiphase_x_3_battery_1_current') | float(0) %}
          {% set c2 = states('sensor.infinisolar_v_multiphase_x_3_battery_2_current') | float(0) %}
          {% set c3 = states('sensor.infinisolar_v_multiphase_x_3_battery_3_current') | float(0) %}
          {% set c4 = states('sensor.infinisolar_v_multiphase_x_3_battery_4_current') | float(0) %}
          {% set c5 = states('sensor.infinisolar_v_multiphase_x_3_battery_5_current') | float(0) %}
          {% set c6 = states('sensor.infinisolar_v_multiphase_x_3_battery_6_current') | float(0) %}
          {% set c7 = states('sensor.infinisolar_v_multiphase_x_3_battery_7_current') | float(0) %}
          {% set c8 = states('sensor.infinisolar_v_multiphase_x_3_battery_8_current') | float(0) %}
          {% set c9 = states('sensor.infinisolar_v_multiphase_x_3_battery_9_current') | float(0) %}
          {{ (c1+c2+c3+c4+c5+c6+c7+c8+c9) | round(1) }}

      # ─── BATTERY kWh AVAILABLE ABOVE SAFE MINIMUM ───────────────────────
      # Total bank = 69.6 kWh (48 kWh Victron + 21.6 kWh Pylontech 9×2.4)
      - name: "battery_kwh_available"
        unique_id: battery_kwh_available
        unit_of_measurement: "kWh"
        state_class: measurement
        state: >
          {% set soc      = states('sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge') | float(0) %}
          {% set capacity = 69.6 %}
          {% set min_soc  = 12 %}
          {{ (((soc - min_soc) / 100) * capacity) | round(2) }}

      # ─── BATTERY DRAIN RATE (kWh per hour at current discharge) ────────
      - name: "battery_drain_rate_kwh_per_hour"
        unique_id: battery_drain_rate_kwh_per_hour
        unit_of_measurement: "kWh/h"
        state_class: measurement
        state: >
          {% set power = states('sensor.battery_power_total') | float(0) %}
          {% if power < 0 %}
            {{ (power / 1000 * -1) | round(3) }}
          {% else %}
            0
          {% endif %}

      # ─── ESTIMATED HOURS TO REACH 12% SoC ──────────────────────────────
      - name: "battery_hours_to_minimum"
        unique_id: battery_hours_to_minimum
        unit_of_measurement: "h"
        state_class: measurement
        state: >
          {% set kwh_left = states('sensor.battery_kwh_available') | float(0) %}
          {% set drain    = states('sensor.battery_drain_rate_kwh_per_hour') | float(0) %}
          {% if drain > 0 %}
            {{ (kwh_left / drain) | round(1) }}
          {% else %}
            99
          {% endif %}

      # ─── HOURS UNTIL SUNRISE ────────────────────────────────────────────
      - name: "hours_until_sunrise"
        unique_id: hours_until_sunrise
        unit_of_measurement: "h"
        state_class: measurement
        state: >
          {% set next_rising = state_attr('sun.sun', 'next_rising') %}
          {% if next_rising %}
            {{ ((as_timestamp(next_rising) - as_timestamp(now())) / 3600) | round(2) }}
          {% else %}
            0
          {% endif %}

      # ─── MINING VIABILITY SCORE (0-100) ─────────────────────────────────
      - name: "mining_viability_score"
        unique_id: mining_viability_score
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set soc           = states('sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge') | float(0) %}
          {% set forecast_tmrw = states('sensor.solcast_pv_forecast_atelier_forecast_tomorrow') | float(0) %}
          {% set surplus       = states('sensor.solar_surplus_power') | float(0) %}
          {% set soc_score      = [soc, 100] | min %}
          {% set forecast_score = [(forecast_tmrw / 80 * 100), 100] | min %}
          {% set surplus_score  = [(surplus / 5000 * 100), 100] | min | max(0) %}
          {{ (soc_score * 0.4 + forecast_score * 0.4 + surplus_score * 0.2) | round(1) }}

      # ─── ML DECISION ENGINE STATUS ────────────────────────────────────
      # Kept as "ready" for automation trigger compatibility
      - name: "mining_decision_context"
        unique_id: mining_decision_context
        state: "ready"

      - name: "ml_model_source"
        unique_id: ml_model_source
        state: >
          {% set metrics_attr = state_attr('sensor.ml_training_metrics', 'status') %}
          {% if metrics_attr == 'improved' or metrics_attr == 'trained_no_cv' %}
            ml_model
          {% elif metrics_attr == 'insufficient_data' %}
            rule_teacher
          {% else %}
            rule_teacher
          {% endif %}

      - name: "ml_training_metrics"
        unique_id: ml_training_metrics
        state_class: measurement
        state: >
          {% set ns = namespace(status='unknown') %}
          {% if states('sensor.ml_training_metrics') not in ['unavailable', 'unknown'] %}
            {{ states('sensor.ml_training_metrics') }}
          {% else %}
            0
          {% endif %}
        attributes:
          last_retrain: "never"
          total_samples: 0
          status: "no_data"
          val_mae: 0
          avg_reward: 0
          model_saved: false

      - name: "ml_total_training_samples"
        unique_id: ml_total_training_samples
        state_class: total_increasing
        state: "{{ states('input_number.ml_training_samples_count') | int(0) }}"

  - sensor:
      - name: "pv power test"
        unit_of_measurement: "kWh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '2022-01-01T00:00:00+00:00'
        state: '{{(states.sensor.productie_atelier.state | float)}}'

      - name: "battery in"
        unit_of_measurement: "kWh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '1970-01-01T00:00:00+00:00'
        state: >
          {% if states('sensor.battery_power') | float(0) >= 0 %}
            {% set battin = states('sensor.battery_power') | float(0) / 1000 %}
          {% else %}
            {% set battin = 0 %}
          {% endif %}
          {{ battin }}

      - name: "battery out"
        unit_of_measurement: "kWh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '1970-01-01T00:00:00+00:00'
        state: >
          {% if states('sensor.battery_power') | float(0) <= 0 %}
            {% set battout = states('sensor.battery_power') | float(0) | abs / 1000 %}
          {% else %}
            {% set battout = 0 %}
          {% endif %}
          {{ battout }}

      - name: "s1 power"
        unit_of_measurement: "kWh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '1970-01-01T00:00:00+00:00'
        state: '{{(states.sensor.mineriis1_power.state | float / 10000 | round(3))}}'

      - name: "enel in"
        unit_of_measurement: "kWh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '1970-01-01T00:00:00+00:00'
        state: >
          {% if states('sensor.enel_grid') | float(0) >= 0 %}
            {% set gridin = states('sensor.enel_grid') | float(0) / 1000 %}
          {% else %}
            {% set gridin = 0 %}
          {% endif %}
          {{ gridin }}

      - name: "enel out"
        unit_of_measurement: "kWh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '1970-01-01T00:00:00+00:00'
        state: >
          {% if states('sensor.enel_grid') | float(0) <= 0 %}
            {% set gridout = states('sensor.enel_grid') | float(0) | abs / 1000 %}
          {% else %}
            {% set gridout = 0 %}
          {% endif %}
          {{ gridout }}

      - name: "pv power cotet"
        unit_of_measurement: "kWh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '2022-01-01T00:00:00+00:00'
        state: '{{(states.sensor.productie_cotet.state | float)}}'

      - name: "pv power atelier"
        unit_of_measurement: "kWh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '2023-11-11T00:00:00+00:00'
        state: '{{(states.sensor.productie_atelier.state | float | abs)}}'

      - name: "pv power easun"
        unit_of_measurement: "Wh"
        device_class: energy
        attributes:
          state_class: total_increasing
          last_reset: '2023-11-11T00:00:00+00:00'
        state: '{{(states.sensor.solar2mqtt_pv_generation_sum.state | float)}}'

      - name: "PV Total"
        unit_of_measurement: "W"
        device_class: energy
        state: "{{(states('sensor.pv_power_cotet')|float) + (states('sensor.pv_power_atelier')|float) + (states('sensor.solar2mqtt_pv_charging_power')|float)}}"

      # ─── BOILER ACTIVE TARGET TEMPERATURE ───────────────────────────────
      # Picks the scheduled minimum temperature based on current hour and day.
      # Weekend (Sat/Sun) overrides the weekday slots entirely.
      - name: "boiler_active_target"
        unique_id: boiler_active_target
        unit_of_measurement: "°C"
        state: >
          {% set h = now().hour %}
          {% set is_weekend = now().weekday() >= 5 %}
          {% if is_weekend %}
            {{ states('input_number.boiler_temp_weekend') | float(45) }}
          {% elif h < 6 %}
            {{ states('input_number.boiler_temp_night') | float(40) }}
          {% elif h < 10 %}
            {{ states('input_number.boiler_temp_morning') | float(50) }}
          {% elif h < 17 %}
            {{ states('input_number.boiler_temp_day') | float(45) }}
          {% elif h < 22 %}
            {{ states('input_number.boiler_temp_evening') | float(55) }}
          {% else %}
            {{ states('input_number.boiler_temp_late') | float(45) }}
          {% endif %}
        attributes:
          slot: >
            {% set h = now().hour %}
            {% set is_weekend = now().weekday() >= 5 %}
            {% if is_weekend %}weekend
            {% elif h < 6 %}night (00-06h)
            {% elif h < 10 %}morning (06-10h)
            {% elif h < 17 %}day (10-17h)
            {% elif h < 22 %}evening (17-22h)
            {% else %}late night (22-24h){% endif %}

      - name: "OPCOM Energyprices"
        unique_id: f1a67a35-7b50-4d95-8ccb-e6642c950061
        unit_of_measurement: RON
        state: "{{ states('sensor.dynamic_current_hour_price') }}"
        attributes:
          times: >
            {% set ns = namespace(times=[]) %}
            {% set today = state_attr('sensor.dynamic_current_hour_price', 'raw_today') %}
            {% if today %}
              {% for hours in today %}
                {% set ns.times = ns.times + [hours.start | as_datetime | as_local | string] %}
              {% endfor %}
            {% endif %}
            {% set tomorrow = state_attr('sensor.dynamic_current_hour_price', 'raw_tomorrow') %}
            {% if tomorrow %}
              {% for hours in tomorrow %}
                {% set ns.times = ns.times + [hours.start | as_datetime | as_local | string] %}
              {% endfor %}
            {% endif %}
            {{ ns.times }}
          prices: >
            {% set ns = namespace(prices=[]) %}
            {% set pzu_value = states('input_number.pzu') | float(0) %}
            {% set today = state_attr('sensor.dynamic_current_hour_price', 'raw_today') %}
            {% if today %}
              {% for hours in today %}
                {% if hours.value is not none %}
                  {% set final_price = (hours.value + pzu_value) / 1000 %}
                  {% set ns.prices = ns.prices + [final_price | round(6)] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% set tomorrow = state_attr('sensor.dynamic_current_hour_price', 'raw_tomorrow') %}
            {% if tomorrow %}
              {% for hours in tomorrow %}
                {% if hours.value is not none %}
                  {% set final_price = (hours.value + pzu_value) / 1000 %}
                  {% set ns.prices = ns.prices + [final_price | round(6)] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.prices }}

  - switch:
      - name: "PDU A4"
        unique_id: pdu_outlet_aa4
        state: "{{ is_state('sensor.outlet_aa4_state', '1') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.pdu_outlet_aa4
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.pdu_outlet_aa4

    
# Victron Configuration.  // If you require stats from your victron system you must have a Venus device installed as part of your Victron installation. This does not use VRM.This users MODBUS

modbus:
  - name: victron
    type: tcp
    host: !secret victron_modbus_host
    port: 502
    sensors:
      - name: Battery Power
        unit_of_measurement: W
        slave: 100
        address: 842
      - name: "Battery SOC"   # // Best battery state of charge, determined from different measurements. read from //com.victronenergy.system
        unit_of_measurement: "%"
        scale: 1
        precision: 1
        slave: 100
        address: 843
      - name: "Battery Voltage"  # // Battery Voltage determined from different measurements. In order of preference: BMV-voltage (V), Multi-DC-Voltage (CV), MPPT-DC-Voltage (ScV), Charger voltage //com.victronenergy.system
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        slave: 100
        address: 840

      - name: "Battery Current" # // Postive: battery begin charged. Negative: battery being discharged read from //com.victronenergy.system
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        slave: 100
        address: 841

      - name: "Battery Power" # // Postive: battery begin charged. Negative: battery being discharged read from //com.victronenergy.system
        unit_of_measurement: "W"
        scale: 1
        precision: 1
        slave: 100
        address: 842

      - name: "Battery State"
        scale: 1
        precision: 1
        slave: 100
        address: 844

      - name: "Battery Consumed Amphours"
        unit_of_measurement: "Ah"
        scale: 10
        precision: 1
        slave: 100
        address: 845
# not suported by CAN-bms##################################################################################
#      - name: "Battery Time to Go"  #\\ Special value: 0 = charging read from //com.victronenergy.system
#        unit_of_measurement: "s"
#        scale: 0.01
#        precision: 1
#        slave: 225
#        address: 303 #846
############################################################################################################

      - name: "Enel Grid"  #\\ Power supplied by Grid to system. read from //com.victronenergy.system
        unit_of_measurement: "W"
        scale: 1
        precision: 1
        slave: 100
        address: 820
        
      - name: "AC Loads"
        unique_id: victron_ac_loads
        unit_of_measurement: "W"
        device_class: power          # ← POWER not energy
        state_class: measurement
        scale: 1
        precision: 1
        slave: 100
        address: 817
        

      - name: "Active input source"  #\\ Power supplied by Grid to system. read from //com.victronenergy.system
        unit_of_measurement: "W"  # \\ 0=Not available;1=Grid;2=Generator;3=Eskom power;240=Not connected
        scale: 1
        precision: 1
        slave: 100
        address: 826

      - name: "Grid lost alarm" # \\ 0=Ok;2=Alarm
        scale: 1
        precision: 1
        slave: 227 #add by Vlad
        address: 64
        
      - name: "ESS State" # \\ 0=Unused, BL disabled;1=Restarting;2=Self-consumption;3=Self-consumption;4=Self-consumption;5=Discharge disabled;6=Force charge;7=Sustain;8=Low Soc Recharge;9=Keep batteries charged;10=BL Disabled;11=BL Disabled (Low SoC);12=BL Disabled (Low SOC recharge)
        scale: 1
        precision: 1
        slave: 100
        address: 2900

      - name: "VE.Bus state" # \\ 0=Off;1=Low Power;2=Fault;3=Bulk;4=Absorption;5=Float;6=Storage;7=Equalize;8=Passthru;9=Inverting;10=Power assist;11=Power supply;252=Bulk protection
        scale: 1
        precision: 1
        slave: 227 #add by Vlad
        address: 31

      - name: "Battery Temperature" #
        unit_of_measurement: "°C"
        scale: 0.1
        precision: 1
        slave: 225
        address: 262
      
      - name: "Battery Discharged Energy"
