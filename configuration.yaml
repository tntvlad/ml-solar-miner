# Loads default set of integrations. Do not remove.
default_config:
# Text to speech
# Example configuration.yaml entry
# InfluxDB Configuration (optional — uncomment and fill in your own values)
#influxdb:
#  api_version: 2
#  host: !secret influxdb_host
#  port: 8086
#  token: !secret influxdb_token
#  organization: !secret influxdb_organization
#  bucket: homeassistant


bluetooth:
tts:
  - platform: google_translate
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
#sensors: !include sensors.yaml

shell_command:
  get_mrr_balance: 'python3 /config/scripts/get_mrr_balance.py'
  run_mining_ml_decision: 'python3 /config/scripts/mining_ml_decision.py --soc {{ states("sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge") | float(0) }} --solar {{ states("sensor.solar_power_total") | float(0) }} --surplus {{ states("sensor.solar_surplus_power") | float(0) }} --voltage {{ states("sensor.infinisolar_v_multiphase_x_3_battery_1_voltage") | float(0) }} --current {{ states("sensor.battery_current_total") | float(0) }} --bpower {{ states("sensor.battery_power_total") | float(0) }} --kwh {{ states("sensor.battery_kwh_available") | float(0) }} --drain {{ states("sensor.battery_drain_rate_kwh_per_hour") | float(0) }} --hmin {{ states("sensor.battery_hours_to_minimum") | float(0) }} --hsun {{ states("sensor.hours_until_sunrise") | float(0) }} --total_load {{ states("sensor.total_load_power") | float(0) | abs }} --miner_actual {{ states("sensor.antminer_miner_consumption_2") | float(0) }} --forecast {{ states("sensor.solcast_pv_forecast_atelier_forecast_tomorrow") | float(0) }} --forecast3 {{ states("sensor.solcast_pv_forecast_forecast_day_3") | float(0) }} --grid {{ states("sensor.victron_vebus_activein_l1_power_227") | float(0) }} --viability {{ states("sensor.mining_viability_score") | float(0) }} --miner_power {{ states("number.antminer_power_limit_2") | float(0) }} --miner_state {{ states("switch.antminer_active_2") }}'
  run_mining_ml_retrain: 'python3 /config/scripts/mining_ml_retrain.py'

input_boolean:
  oil_pid_enabled:
    name: PID Enabled

  oil_pid_invert:
    name: PID Invert

  # ── BOILER CONTROL ──────────────────────────────────────────────────────
  boiler_auto_enabled:
    name: "Boiler Auto Control"
    icon: mdi:water-boiler-auto

  boiler_solar_boost_enabled:
    name: "Boiler Solar Boost"
    icon: mdi:solar-power

input_select:
  oil_pid_round:
    name: PID Round
    options:
      - Floor
      - Ceil
      - Round

    
# Input numbers for tracking stats and settings
input_number:
  ml_training_samples_count:
    name: ML Training Samples
    min: 0
    max: 100000
    step: 1
    initial: 0

  oil_pid_output:
    name: Oil PID Output
    min: 0
    max: 120
    step: 0.1

  oil_pid_kp:
    name: PID Kp
    min: 0
    max: 100
    step: 0.01

  oil_pid_ki:
    name: PID Ki
    min: 0
    max: 10
    step: 0.01

  oil_pid_kd:
    name: PID Kd
    min: 0
    max: 10
    step: 0.01

  oil_pid_sample_time:
    name: PID Sample Time
    min: 1
    max: 300
    step: 1

  oil_pid_min_output:
    name: PID Min Output
    min: -20
    max: 100
    step: 1

  oil_pid_max_output:
    name: PID Max Output
    min: 0
    max: 120
    step: 1

  oil_pid_windup:
    name: PID Windup
    min: 0
    max: 100
    step: 1

  oil_pid_precision:
    name: PID Precision
    min: 0
    max: 4
    step: 1

#old parameters
  oil_temp_target:
    name: "Oil Temperature Target"
    min: 10
    max: 65
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  # ── BOILER SCHEDULE TEMPERATURES ────────────────────────────────────────
  boiler_temp_night:
    name: "Boiler Night (00-06h)"
    min: 30
    max: 75
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    mode: slider

  boiler_temp_morning:
    name: "Boiler Morning (06-10h)"
    min: 30
    max: 75
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    mode: slider

  boiler_temp_day:
    name: "Boiler Day (10-17h)"
    min: 30
    max: 75
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    mode: slider

  boiler_temp_evening:
    name: "Boiler Evening (17-22h)"
    min: 30
    max: 75
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    mode: slider

  boiler_temp_late:
    name: "Boiler Late Night (22-24h)"
    min: 30
    max: 75
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    mode: slider

  boiler_temp_weekend:
    name: "Boiler Weekend (Sat-Sun)"
    min: 30
    max: 75
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    mode: slider

  boiler_hysteresis:
    name: "Boiler Hysteresis Band"
    min: 2
    max: 4
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-lines
    mode: slider
   
  
  anticipation_factor:
    name: Anticipation Factor
    min: 0.
    max: 10
    step: 0.1
    mode: slider
  anticipation_threshold:
    name: Anticipation Threshold
    min: 0.
    max: 10
    step: 0.1
    mode: slider
  cooling_hysteresis:
    name: Cooling Hysteresis
    min: 0.1
    max: 5
    step: 0.1
    mode: slider

counter:
  cooling_corrections:
    name: Cooling Corrections in 6h
    initial: 0
    step: 1

input_datetime:
  last_cooling_cycle:
    name: Last Cooling Cycle
    has_date: true
    has_time: true    

homeassistant:
  external_url: !secret external_url
  internal_url: !secret internal_url
  time_zone: Europe/Bucharest

