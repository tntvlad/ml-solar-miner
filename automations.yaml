- id: boiler_schedule_control
  alias: "\U0001F6BF Boiler Schedule Control"
  description: Maintains boiler at schedule target with hysteresis band. Solar boost
    takes priority when active.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: sensor.tasmota_ds18b20_temperature
  - trigger: time_pattern
    minutes: /2
  - trigger: time_pattern
    hours: /1
    minutes: '0'
  conditions:
  - condition: state
    entity_id: input_boolean.boiler_auto_enabled
    state: 'on'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.boiler_solar_boost_enabled
      state: 'off'
    - condition: numeric_state
      entity_id: sensor.victron_battery_current
      below: 85
  actions:
  - variables:
      temp: '{{ states(''sensor.tasmota_ds18b20_temperature'') | float(0) }}'
      target: '{{ states(''sensor.boiler_active_target'') | float(45) }}'
      band: '{{ states(''input_number.boiler_hysteresis'') | float(3) }}'
      is_on: '{{ is_state(''switch.pdu_outlet_aa7'', ''on'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ temp < target }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.pdu_outlet_aa7
      - action: logbook.log
        data:
          name: "\U0001F6BF Boiler Schedule"
          message: 'ON | {{ temp }}°C < target {{ target }}°C | slot: {{ state_attr(''sensor.boiler_active_target'',
            ''slot'') }} | band ±{{ band }}°C

            '
    - conditions:
      - condition: template
        value_template: '{{ temp >= target + band }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.pdu_outlet_aa7
      - action: logbook.log
        data:
          name: "\U0001F6BF Boiler Schedule"
          message: 'OFF | {{ temp }}°C >= {{ target + band }}°C (target {{ target
            }}°C + band {{ band }}°C)

            '
- id: boiler_battery_boost
  alias: ⚡ Boiler Battery Boost (>90A)
  description: Heats boiler using solar surplus when battery charging current exceeds
    90A. Hard cap at 80°C.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: numeric_state
    entity_id: sensor.victron_battery_current
    above: 90
  - trigger: numeric_state
    entity_id: sensor.victron_battery_current
    below: 85
  - trigger: numeric_state
    entity_id: sensor.tasmota_ds18b20_temperature
    above: 80
  conditions:
  - condition: state
    entity_id: input_boolean.boiler_solar_boost_enabled
    state: 'on'
  actions:
  - variables:
      temp: '{{ states(''sensor.tasmota_ds18b20_temperature'') | float(0) }}'
      battery_amps: '{{ states(''sensor.victron_battery_current'') | float(0) }}'
      boost_on: '{{ battery_amps > 90 and temp < 80 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ boost_on }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.pdu_outlet_aa7
      - action: logbook.log
        data:
          name: ⚡ Boiler Boost
          message: 'ON | Battery {{ battery_amps | round(0) }}A > 90A | Boiler {{
            temp }}°C (cap 80°C)

            '
    - conditions:
      - condition: template
        value_template: '{{ not boost_on }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.pdu_outlet_aa7
      - action: logbook.log
        data:
          name: ⚡ Boiler Boost
          message: 'OFF | Battery {{ battery_amps | round(0) }}A | Boiler {{ temp
            }}°C | {{ ''Cap reached (80°C)'' if temp >= 80 else ''Solar insufficient''
            }}

            '
