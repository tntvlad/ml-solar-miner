- id: mining_decision_engine_ml
  alias: "⛏️ Mining Decision Engine (ML)"
  description: Runs ML decision script, parses JSON response, and applies miner settings
  triggers:
  - trigger: time_pattern
    minutes: /20
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.mining_decision_context'') == ''ready'' }}'
  - condition: template
    value_template: "{{ states('sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge')\n
      \  not in ['unknown', 'unavailable'] }}\n"
  actions:
  - alias: Run ML decision script
    action: shell_command.run_mining_ml_decision
    response_variable: ml_response
  - alias: Extract stdout from response
    variables:
      ml_stdout: '{{ ml_response.stdout | default(ml_response | string) }}'
  - alias: Parse ML JSON response
    variables:
      raw_response: '{{ ml_stdout }}'
      parsed: '{{ ml_stdout | string | trim | from_json }}'
  - alias: Calculate safe final values
    variables:
      soc: '{{ states(''sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge'')
        | float(0) }}'
      safe_miner: '{% if soc < 10 %}off{% else %}{{ parsed.miner_active | default(''off'')
        }}{% endif %}'
      safe_power: '{% set raw = parsed.miner_power | int(3500) %}

        {% set clamped = [[raw, 3500] | max, 6000] | min %}

        {{ ((clamped / 100) | round(0) * 100) | int }}

        '
  - alias: Set miner switch
    action: switch.turn_{{ safe_miner }}
    target:
      entity_id: switch.antminer_active_2
  - alias: Set miner power level
    if:
    - condition: template
      value_template: '{{ safe_miner == ''on'' }}'
    then:
    - action: number.set_value
      target:
        entity_id: number.antminer_power_limit_2
      data:
        value: '{{ safe_power }}'
  - alias: Log mining decision
    action: logbook.log
    data:
      name: Mining ML
      message: 'MODE: {{ parsed.mode | default(''unknown'') | upper }} | Miner: {{
        safe_miner | upper }} @ {{ safe_power }}W | SoC: {{ states(''sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge'')
        }}% | Solar: {{ states(''sensor.solar_power_total'') }}W | Surplus: {{ states(''sensor.solar_surplus_power'')
        }}W | Source: {{ parsed.source | default(''unknown'') }} | REASON: {{ parsed.reason | default(''no reason given'')
        }}'
  - alias: Update training samples sensor
    action: input_number.set_value
    target:
      entity_id: input_number.ml_training_samples_count
    data:
      value: '{{ parsed.training_samples | int(0) }}'
  - alias: Notify if ML fallback triggered
    if:
    - condition: template
      value_template: '{{ parsed.mode | default('''') == ''fallback_safe'' }}'
    then:
    - action: persistent_notification.create
      data:
        title: "\u26a0\ufe0f Mining ML \u2014 Fallback Activated"
        message: 'ML script returned invalid or empty JSON at {{ now().strftime(''%H:%M'')
          }}. Safe defaults applied: Miner OFF @ 3500W. Raw response (first
          300 chars): {{ raw_response[:300] }}'
        notification_id: mining_ml_fallback
  mode: restart
  max_exceeded: silent
- id: mining_safety_watchdog
  alias: "\U0001F6E1️ Mining Safety Watchdog"
  description: Hard battery protection — runs independently of AI decisions
  triggers:
  - minutes: /2
    trigger: time_pattern
  - entity_id: sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge
    trigger: state
  actions:
  - variables:
      soc: '{{ states(''sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge'')
        | float(0) }}'
      grid_power: '{{ states(''sensor.victron_vebus_activein_l1_power_227'') | float(0)
        }}'
      current_adj_power: '{{ states(''number.antminer_power_limit_2'') | float(3500)
        }}'
  - if:
    - condition: template
      value_template: '{{ soc < 10 }}'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.antminer_active_2
    - action: logbook.log
      data:
        name: "\U0001F6E1️ Safety Watchdog"
        message: "\U0001F534 CRITICAL: SoC {{ soc }}% below 10% — Miner OFF\n"
  - if:
    - condition: template
      value_template: '{{ grid_power > 300 and is_state(''switch.antminer_active_2'',
        ''on'') }}'
    then:
    - action: number.set_value
      target:
        entity_id: number.antminer_power_limit_2
      data:
        value: '{{ [current_adj_power - 500, 3500] | max }}'
    - action: logbook.log
      data:
        name: "\U0001F6E1️ Safety Watchdog"
        message: "\U0001F7E0 GRID IMPORT: {{ grid_power }}W detected — Reduced miner
          from {{ current_adj_power }}W to {{ [current_adj_power - 500, 3500] | max
          }}W\n"
  mode: single
  max_exceeded: silent
- id: mining_morning_reset
  alias: "\U0001F305 Mining Morning Reset"
  description: At sunrise, if SoC is safe, let AI take over miner control
  mode: single
  triggers:
  - trigger: sun
    event: sunrise
    offset: +00:15:00
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge'')
      | float(0) > 15 }}'
  actions:
  - action: logbook.log
    data:
      name: "\U0001F305 Morning Reset"
      message: 'Sunrise reset — SoC: {{ states(''sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge'')
        }}% Solar: {{ states(''sensor.solar_power_total'') }}W. AI will take over
        on next cycle.'
- id: boiler_solar_control
  alias: "\U0001F6BF Boiler Solar Control"
  description: 'Controls AA7 boiler (future AA8, AA9) using solar surplus. 3 modes
    based on today forecast: energy_saving below 80kWh (ON<45/OFF>55), normal 80-120kWh
    (ON<55/OFF>65), high above 120kWh (ON<65/OFF>75). Each element 2.2kW.'
  triggers:
  - trigger: state
    entity_id: sensor.tasmota_ds18b20_temperature
    for:
      seconds: 30
  - trigger: time_pattern
    minutes: /5
  conditions: []
  actions:
  - variables:
      forecast: '{{ states(''sensor.solcast_pv_forecast_atelier_forecast_today'')
        | float(0) }}'
      temp: '{{ states(''sensor.tasmota_ds18b20_temperature'') | float(0) }}'
      surplus: '{{ states(''sensor.solar_surplus_power'') | float(0) }}'
      soc: '{{ states(''sensor.infinisolar_v_multiphase_x_3_battery_state_of_charge'')
        | float(0) }}'
      heating_mode: '{% if forecast >= 120 %}high{% elif forecast >= 80 %}normal{%
        else %}energy_saving{% endif %}'
      temp_on: '{% if heating_mode == ''high'' %}65{% elif heating_mode == ''normal''
        %}55{% else %}45{% endif %}'
      temp_off: '{% if heating_mode == ''high'' %}75{% elif heating_mode == ''normal''
        %}65{% else %}55{% endif %}'
      solar_ok: '{{ surplus > 2200 or soc > 90 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ temp > 80 }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.pdu_outlet_aa7
      - action: logbook.log
        data:
          name: "\U0001F6BF Boiler"
          message: "\U0001F534 OVERHEAT: {{ temp }}°C — AA7 OFF"
    - conditions:
      - condition: template
        value_template: '{{ temp < temp_on and solar_ok }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.pdu_outlet_aa7
      - action: logbook.log
        data:
          name: "\U0001F6BF Boiler"
          message: HEAT ON | {{ heating_mode }} | {{ temp }}°C \u2192 target {{ temp_off
            }}°C | forecast {{ forecast | round(0) }}kWh | surplus {{ surplus | round(0)
            }}W
    - conditions:
      - condition: template
        value_template: '{{ temp >= temp_off or (not solar_ok and is_state(''switch.pdu_outlet_aa7'',
          ''on'')) }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.pdu_outlet_aa7
      - action: logbook.log
        data:
          name: "\U0001F6BF Boiler"
          message: HEAT OFF | {{ heating_mode }} | {{ temp }}°C | forecast {{ forecast
            | round(0) }}kWh | surplus {{ surplus | round(0) }}W
  mode: single
  max_exceeded: silent
- id: boiler_weekly_sanitation
  alias: "\U0001F9AB Boiler Weekly Sanitation"
  description: Heats boiler to 75°C every Sunday to kill Legionella. Only runs if
    tomorrow solar forecast >= 120kWh.
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: time
    weekday:
    - sun
  - condition: template
    value_template: '{{ states(''sensor.solcast_pv_forecast_atelier_forecast_today'')
      | float(0) >= 120 }}'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.pdu_outlet_aa7
  - wait_template: '{{ states(''sensor.tasmota_ds18b20_temperature'') | float(0) >=
      75 }}'
    timeout:
      hours: 6
    continue_on_timeout: true
  - action: switch.turn_off
    target:
      entity_id: switch.pdu_outlet_aa7
  - action: logbook.log
    data:
      name: "\U0001F9AB Boiler Sanitation"
      message: 'Sanitation {{ ''complete'' if wait.completed else ''TIMEOUT (6h max)''
        }}. Final temp: {{ states(''sensor.tasmota_ds18b20_temperature'') }}°C'
  - action: persistent_notification.create
    data:
      title: "\U0001F9AB Boiler Sanitation"
      message: 'Sanitation {{ ''complete \u2705'' if wait.completed else ''TIMEOUT
        \u26a0\ufe0f'' }}. Final temp: {{ states(''sensor.tasmota_ds18b20_temperature'')
        }}°C'
  mode: single
- id: miner_heat_recovery_boiler
  alias: "\U0001F525 Miner Heat Recovery → Boiler"
  description: Pumps miner waste heat to boiler when miner outlet is hotter than boiler
    and miner is running
  triggers:
  - trigger: state
    entity_id: sensor.antminer_board_0_water_outlet_temperature
    for:
      seconds: 10
  - trigger: state
    entity_id: sensor.tasmota_ds18b20_temperature
    for:
      seconds: 10
  - trigger: state
    entity_id: switch.antminer_active_2
  conditions: []
  actions:
  - variables:
      outlet_temp: '{{ states(''sensor.antminer_board_0_water_outlet_temperature'')
        | float(0) }}'
      boiler_temp: '{{ states(''sensor.tasmota_ds18b20_temperature'') | float(0) }}'
      miner_on: '{{ is_state(''switch.antminer_active_2'', ''on'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ outlet_temp > boiler_temp and miner_on }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.dhw_oil
      - action: logbook.log
        data:
          name: "\U0001F525 Heat Recovery"
          message: Pump ON | Miner outlet {{ outlet_temp }}°C > Boiler {{ boiler_temp
            }}°C
    - conditions:
      - condition: template
        value_template: '{{ outlet_temp <= boiler_temp or not miner_on }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.dhw_oil
      - action: logbook.log
        data:
          name: "\U0001F525 Heat Recovery"
          message: 'Pump OFF | Miner outlet {{ outlet_temp }}°C | Boiler {{ boiler_temp
            }}°C | Miner: {{ ''ON'' if miner_on else ''OFF'' }}'
  mode: single
  max_exceeded: silent
- id: miner_chip_cooling
  alias: ❄️ Miner Chip Cooling
  description: Activates outside cooling when miner chip temp exceeds 75°C. Turns
    off when miner is off.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.antminer_board_0_chip_temperature_2
    above: 60
  - trigger: state
    entity_id: switch.antminer_active_2
    to: 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.antminer_board_0_chip_temperature_2
        above: 60
      - condition: state
        entity_id: switch.antminer_active_2
        state: 'on'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.cooling_oil
      - action: logbook.log
        data:
          name: ❄️ Chip Cooling
          message: Cooling ON | Chip temp {{ states('sensor.antminer_board_0_chip_temperature_2')
            }}°C > 75°C
    - conditions:
      - condition: state
        entity_id: switch.antminer_active_2
        state: 'off'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.cooling_oil
      - action: logbook.log
        data:
          name: ❄️ Chip Cooling
          message: Cooling OFF | Miner turned off
  mode: single
  max_exceeded: silent
- id: '1775814778535'
  alias: Notify When Block Found - Enhanced
  description: Send notification to phone when miners find blocks, including best
    share info
  triggers:
  - entity_id: sensor.s19_1_found_blocks
    id: s19_block
    trigger: state
  - entity_id: sensor.antminer2_found_blocks
    id: antminer2_block
    trigger: state
  conditions:
  - condition: template
    value_template: '{% set old_state = trigger.from_state.state | int(0) %} {% set
      new_state = trigger.to_state.state | int(0) %} {{ new_state > old_state and
      new_state != 0 }}

      '
  actions:
  - data:
      title: "\U0001F389 BLOCK FOUND! \U0001F389"
      message: "{% if trigger.id == 's19_block' %}\n  \U0001F3C6 S19 Miner found a
        block!\n  \U0001F4CA Total blocks: {{ states('sensor.s19_1_found_blocks')
        }}\n  \U0001F3AF Best share: {{ states('sensor.s19_1_best_share') }}\n  ⏰
        Time: {{ now().strftime('%H:%M:%S') }}\n{% else %}\n  \U0001F3C6 Antminer2
        found a block!\n  \U0001F4CA Total blocks: {{ states('sensor.antminer2_found_blocks')
        }}\n  \U0001F3AF Best share: {{ states('sensor.antminer2_best_share') }}\n
        \ ⏰ Time: {{ now().strftime('%H:%M:%S') }}\n{% endif %}\n"
      data:
        notification_icon: mdi:bitcoin
        color: green
        importance: high
        persistent: true
        tag: block_found
        actions:
        - action: view_dashboard
          title: View Dashboard
        - action: dismiss
          title: Dismiss
        channel: Mining Alerts
        sticky: true
        vibrationPattern: 100,1000,100,1000,100
    action: notify.mobile_app_YOUR_TABLET
  - data:
      name: Block Found
      message: "{% if trigger.id == 's19_block' %}\n  S19 found block #{{ states('sensor.s19_1_found_blocks')
        }} with best share {{ states('sensor.s19_1_best_share') }}\n{% else %}\n  Antminer2
        found block #{{ states('sensor.antminer2_found_blocks') }} with best share
        {{ states('sensor.antminer2_best_share') }}\n{% endif %}\n"
      entity_id: "{% if trigger.id == 's19_block' %}\n  sensor.s19_1_found_blocks\n{%
        else %}\n  sensor.antminer2_found_blocks\n{% endif %}\n"
    action: logbook.log
  mode: parallel
  max: 10
