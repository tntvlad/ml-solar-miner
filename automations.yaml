  - action: logbook.log
    data:
      name: ML Retrain
      message: Triggered by SoC drop below 12%
  mode: single
  max_exceeded: silent
- id: mining_ml_retrain_wasted_solar
  alias: "🧠 ML Retrain — Wasted Solar Energy"
