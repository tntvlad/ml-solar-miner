- id: mining_ml_weekly_retrain
  alias: "🧠 ML Weekly Retrain"
  description: Retrains ML model weekly at 03:00 using accumulated training data
  triggers:
  - trigger: time
    at: "03:00:00"
  conditions: []
  actions:
  - alias: Run ML retrain script
    action: shell_command.run_mining_ml_retrain
    response_variable: retrain_response
  - alias: Extract retrain stdout
    variables:
      retrain_stdout: '{{ retrain_response.stdout | default(retrain_response | string) }}'
  - alias: Log retrain results
    action: logbook.log
    data:
      name: ML Retrain
      message: Weekly retrain complete
  - alias: Notify retrain results
    if:
    - condition: template
      value_template: '{{ retrain_stdout | default('''') | length > 0 }}'
    then:
    - action: persistent_notification.create
      data:
        title: "\U0001f9e0 ML Model Retrained"
        message: '{{ retrain_stdout }}'
        notification_id: ml_retrain_weekly
  mode: single
  max_exceeded: silent
- id: mining_ml_retrain_grid_spike
  alias: "🧠 ML Retrain — Grid Import Spike"
  description: Trigger retrain when grid import exceeds 500W for 10+ minutes
  triggers:
  - trigger: numeric_state
    entity_id: sensor.victron_vebus_activein_l1_power_227
